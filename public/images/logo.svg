<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="200" height="200" rx="22" fill="url(#bg)"/>
  <!-- Monitor screen -->
  <rect x="30" y="30" width="140" height="100" rx="10" fill="none" stroke="url(#grad)" stroke-width="8"/>
  <!-- Screen content: code brackets -->
  <text x="100" y="97" font-family="Arial Black, monospace" font-weight="900" font-size="42" fill="url(#grad)" text-anchor="middle">&lt;/&gt;</text>
  <!-- Monitor stand -->
  <rect x="88" y="130" width="24" height="22" rx="3" fill="url(#grad)"/>
  <!-- Monitor base -->
  <rect x="65" y="150" width="70" height="10" rx="5" fill="url(#grad)"/>
  <!-- GS initials below -->
  <text x="100" y="188" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="22" fill="url(#grad)" text-anchor="middle">GS</text>
</svg>
